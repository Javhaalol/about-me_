<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .code {
            height: 200px;
            width: 200px;
        }

        .first-code {
            background-color: brown;
        }




        .first-code:hover {
            height: 400px;
            width: 400px;
            background-color: aqua;
        }

        

        .code-first {
            background-color: blue;
        }

        .code-first:hover {
            height: 400px;
            width: 400px;
            background-color: black;
        }


        .code-1 {
            background-color: blueviolet;
        }

        .code-1:hover{
            width: 400px;
            height: 400px;
            background-color: red;
        }

       .container {
            display: flex;
            gap: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="code first-code"> </div>

        <div class="code code-first"> </div>

        <div class="code code-1"> </div>
    </div>



</body>

</html>
